name: Passkeys CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/passkeys-webauthn]
permissions:
  contents: read
concurrency:
  group: passkeys-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
